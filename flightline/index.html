<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlightLine</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
	<nav class="side">
		<div class="brand">
			<span class="brand-ic"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span>
			<b>FlightLine</b>
		</div>
		<button class="nav on" data-view="logbook"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Logbook</span></button>
		<button class="nav" data-view="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
		<button class="nav" data-view="live" id="navLive" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg><span>Live</span></button>
		<div class="soon">
			<span>Coming next</span>
			<div>Debrief and replay</div>
			<div>Start session</div>
			<div>Route ideas</div>
		</div>
		<div class="sim" id="sim"><i></i><span>Looking for MSFS…</span></div>
	</nav>
	<main id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="dialog" id="dialog" hidden></div>
<script src="app.js"></script>
</body>
</html>
